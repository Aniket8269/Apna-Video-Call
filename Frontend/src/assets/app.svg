<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for Premium App Icon Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background in #d98500 -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#d98500" />

  <!-- Central Icon Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Video Camera Lens (Right) in Black -->
    <path d="M 280 220 
             L 384 158 
             C 398 149 416 159 416 175 
             L 416 337 
             C 416 353 398 363 384 354 
             L 280 292 Z" fill="#000000" />

    <!-- Video Camera Body (Left) in Black -->
    <rect x="110" y="171" width="190" height="170" rx="45" fill="#000000" />
  </g>
</svg>